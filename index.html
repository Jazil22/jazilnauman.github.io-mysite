<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      background: #1e293b;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #38bdf8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, World!</h1>
    <p>This is a starter page for your GitHub Pages site. Replace this content with your own, push to your repo, and it'll go live automatically.</p>
    <div class="badge">✓ Hosted on GitHub Pages</div>
  </div>
</body>
</html>
